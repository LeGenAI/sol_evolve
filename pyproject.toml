[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solevolve"
version = "0.1.0"
description = "LLM-guided, solver-verified combinatorial search scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Jon-Lark Kim" },
  { name = "Jae-Hyun Baek" },
]
dependencies = [
  "langchain-core==1.0.7",
  "langchain-openai==1.0.3",
  "langgraph==1.0.3",
  "langsmith>=0.4.0",
  "numpy>=2.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
solevolve-demo = "solevolve.run_demo:main"
solevolve-solver-smoke = "solevolve.solver_smoke:main"
solevolve-artifact-check = "solevolve.artifact_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solevolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
