[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solevolve"
version = "0.1.0"
description = "LLM-guided, solver-verified combinatorial search scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Jon-Lark Kim" },
  { name = "Jae-Hyun Baek" },
]
dependencies = [
  "langchain-core==1.0.7",
  "langchain-openai==1.0.3",
  "langgraph==1.0.3",
  "langsmith>=0.7.31",
  "numpy>=2.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
]

[project.scripts]
solevolve-demo = "solevolve.run_demo:main"
solevolve-reproduce-ternary-bch = "solevolve.ternary_bch_repro:main"
solevolve-reproduce-paper-claims = "solevolve.so_claim_repro:main"
solevolve-reviewer-reproduce = "solevolve.reviewer_reproduction:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solevolve"]
