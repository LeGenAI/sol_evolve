name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src/solevolve
      - name: Check reviewer verdicts and archived GF(5) matrix
        run: python scripts/check_reviewer_acceptance.py
      - name: Install CaDiCaL
        run: sudo apt-get update && sudo apt-get install -y cadical
      - name: Reproduce core claims and archived Hybrid SAT-GA witness
        run: |
          solevolve-reviewer-reproduce --paper-claim-id all_reviewer_core --cadical-path /usr/bin/cadical --timeout 300 --require-pass
          solevolve-reviewer-reproduce --paper-claim-id binary_22_11_7_hybrid_ga --hybrid-ga-mode archived --require-pass
